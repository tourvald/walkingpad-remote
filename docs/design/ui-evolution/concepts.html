  #walkingpad-concepts .wp-phone[data-workout="true"] .wp-tabbar { flex-shrink: 0; }
  #walkingpad-concepts .wp-phone[data-workout="true"] .wp-home { flex-shrink: 0; }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-layout { gap: 5px; }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-scroll .wp-live { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; text-align: left; }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-scroll .wp-number { grid-column: 1; grid-row: 2 / 4; font-size: calc(44px * var(--wp-scale)); }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-scroll .wp-live-label { justify-content: flex-start; }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-scroll .wp-unit { align-self: center; }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-scroll .wp-zone-state { margin-top: 2px; align-self: center; }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-scroll .wp-zones { margin-top: 12px; }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-scroll .wp-zone { min-height: 34px; }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-dock .wp-metric strong { font-size: calc(24px * var(--wp-scale)); }
  #walkingpad-concepts .wp-phone[data-compact="true"] .wp-workout-dock .wp-metrics { grid-template-columns: 1fr 1fr; }
  @media (max-width: 359px) {
    #walkingpad-concepts .wp-content { padding-left: 16px; padding-right: 16px; }
    #walkingpad-concepts .wp-surface { padding: 18px; }
    #walkingpad-concepts .wp-presets { grid-template-columns: repeat(3,1fr); }
    #walkingpad-concepts .wp-ready-item { gap: 6px; padding: 10px; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('walkingpad-concepts');
  const phone = root.querySelector('.wp-phone');
  const content = root.querySelector('.wp-content');
  const scenario = root.querySelector('#wp-scenario');
  const overlay = root.querySelector('.wp-overlay');
  const state = { concept: 'focus', screen: 'active', zone: 3, minutes: 30, appearance: 'system', largeText: false, period: 'week', plankRunning: false, showPiP: true, phoneSize: '393x852' };
  const ranges = ['60–134','135–146','147–158','159–170','171–220'];
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const heading = (title, action = 'settings', glyph = 'sliders-horizontal') => `<header class="wp-header"><h1>${title}</h1><button type="button" class="wp-icon-button" data-screen="${action}" aria-label="${action === 'ready' ? 'Вернуться к тренировке' : 'Параметры'}">${icon(glyph)}</button></header>`;
  const action = (label, attr, style = 'primary', glyph = '') => `<button type="button" class="wp-${style}" ${attr}>${glyph ? icon(glyph) : ''}${label}</button>`;
  const metric = (title,value,unit='') => `<div class="wp-metric"><span class="wp-metric-label">${title}</span><strong>${value}${unit ? ` <small>${unit}</small>` : ''}</strong></div>`;
  function zones(interactive = true, bpm = null) {
    const bounds = [[60,134],[135,146],[147,158],[159,170],[171,220]];
    const index = bpm === null ? -1 : bounds.findIndex(([low,high]) => bpm >= low && bpm <= high);
    const fraction = index < 0 ? null : (index + (bpm-bounds[index][0])/(bounds[index][1]-bounds[index][0]))/5;
    const marker = fraction === null ? '' : `<span class="wp-marker" style="left:${fraction*100}%" aria-hidden="true"></span>`;
    return `<div class="wp-zones" role="group" aria-label="Пульсовые зоны${bpm === null ? '' : ', текущий пульс '+bpm}">${marker}${ranges.map((r,i) => `<${interactive ? 'button type="button"' : 'div'} class="wp-zone" ${interactive ? `data-zone="${i+1}"` : ''} aria-label="Зона ${i+1}, ${r} ударов в минуту" ${interactive ? `aria-pressed="${state.zone === i+1}"` : ''} style="--zone:var(--wp-z${i+1})">${state.zone === i+1 ? '✓ ' : ''}Z${i+1}<i style="${state.zone === i+1 ? 'opacity:1' : ''}"></i></${interactive ? 'button' : 'div'}>`).join('')}</div>`;
  }
  function ready() {
    return heading('Тренировка') + `<div class="wp-readiness"><button type="button" class="wp-ready-item" data-screen="devices">${icon('check-circle-2')}<span>Дорожка<small>Подключена</small></span></button><div class="wp-ready-item">${icon('heart')}<span>Пульс готов<small>HealthKit</small></span></div></div>
      <div class="wp-surface wp-training-hero"><div class="wp-mode">${icon('heart-pulse')} HR-контроль</div><div class="wp-eyebrow">Целевая зона</div><div class="wp-target">Зона ${state.zone}</div><p class="wp-target-sub">${ranges[state.zone-1]} <span class="wp-small">уд/мин</span></p>${zones()}</div>
      <section class="wp-section"><div class="wp-section-title"><h2>Длительность</h2><span class="wp-muted wp-small">мин</span></div><div class="wp-presets">${[20,25,30,35,40,45].map(v => `<button type="button" data-minutes="${v}" aria-label="${v} минут" aria-pressed="${state.minutes === v}">${v}</button>`).join('')}</div></section>
      <div class="wp-actions">${action('Начать тренировку','data-screen="active"','primary','play')}</div>`;
  }
  function active() {
    const cool = state.screen === 'cooldown';
    const missing = state.screen === 'no-hr';
    const disconnected = state.screen === 'disconnected';
    const bpm = missing ? '—' : cool ? '124' : '152';
    const tempo = state.concept === 'tempo';
    const relation = missing ? 'Сигнал недоступен' : cool ? 'Пульс выше цели' : state.zone < 3 ? 'Выше целевой зоны' : state.zone > 3 ? 'Ниже целевой зоны' : 'В целевой зоне';
    const target = cool ? 'Цель заминки · ≤ 115 уд/мин' : `Зона ${state.zone} · ${ranges[state.zone-1]} уд/мин`;
    const metrics = `<div class="wp-metrics">${metric('Скорость',disconnected ? '—' : cool ? '3,0' : '4,4','км/ч')}${metric(tempo ? 'Пульс' : 'Прошло',tempo ? bpm : '18:42',tempo ? 'уд/мин' : '')}</div>`;
    const stop = action('Остановить','data-stop','stop','square');
    const warning = missing ? '<p class="wp-warning">Нет актуального пульса. Остановка остаётся доступной.</p>' : disconnected ? '<p class="wp-warning">Связь с дорожкой потеряна. Скорость неизвестна.</p>' : '';
    const hero = `<section class="wp-surface wp-training-hero"><div class="wp-live"><div class="wp-live-label">${icon(tempo ? 'clock-3' : 'heart')} ${tempo ? 'Прошло' : 'Пульс'}</div><div class="wp-number">${tempo ? '18:42' : bpm}</div>${tempo ? '' : '<div class="wp-unit">уд/мин</div>'}<div class="wp-zone-state">${icon(missing ? 'signal-zero' : cool ? 'arrow-down' : 'check')} ${relation}</div></div>${zones(false,missing ? null : Number(bpm))}<p class="wp-note" style="text-align:center">${target}</p></section>`;
    const video = `<div class="wp-video-space" aria-label="Свободная верхняя область под внешнее окно видео">${state.showPiP ? `<div class="wp-pip-demo" role="img" aria-label="Пример размещения внешнего видео в режиме картинка в картинке">${icon('picture-in-picture-2')}<span>Пример видео · PiP</span></div>` : ''}</div>`;
    return `<div class="wp-workout-layout">${video}<header class="wp-workout-heading"><h1>${cool ? 'Заминка' : 'Тренировка'}</h1>${cool ? '<span class="wp-phase">Восстановление</span>' : action('+5 минут','data-extend','secondary')}</header><div class="wp-workout-scroll">${hero}${warning}</div><div class="wp-workout-dock">${metrics}${stop}</div></div>`;
  }
  function result() {
    const partial = state.screen === 'partial';
    const vals = ['3:20','5:40','18:10','2:50','0:00'];
    const widths = [11.1,18.9,60.6,9.4,0];
    return heading('Итог тренировки','ready','x') + `<div class="wp-result-hero"><div class="wp-eyebrow">Сегодня · 30 минут</div><div class="wp-number">${partial ? '30:00' : '2,20'}${partial ? '' : ' <small>км</small>'}</div><p class="wp-muted">${partial ? 'Продолжительность' : 'Дистанция'}</p></div>
      <div class="wp-metrics">${metric('Средний пульс','149','уд/мин')}${partial ? '' : metric('Средняя скорость','4,4','км/ч')}</div>
      <section class="wp-section wp-surface"><h2>Время в зонах</h2>${vals.map((v,i) => `<div class="wp-zone-row" style="--zone:var(--wp-z${i+1})"><span>Зона ${i+1}</span><div class="wp-zone-track" aria-hidden="true"><i style="width:${widths[i]}%"></i></div><span style="text-align:right;font-variant-numeric:tabular-nums">${v}</span></div>`).join('')}</section>
      ${partial ? '<p class="wp-note">Часть данных недоступна</p>' : ''}<div class="wp-actions">${action('Готово','data-screen="ready"')}${action('Открыть статистику','data-screen="stats"','secondary')}</div>`;
  }
  function stats() {
    const month = state.period === 'month';
    const days = month ? ['1–7','8–14','15–21','22–30'] : ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    const times = month ? [30,94,0,0] : [30,0,34,0,30,0,0];
    const history = month ? [['Сегодня','30 мин','149'],['9 сентября','34 мин','146'],['7 сентября','30 мин','148'],['3 сентября','30 мин','147']] : [['Сегодня','30 мин','149'],['9 сентября','34 мин','146'],['7 сентября','30 мин','148']];
    return heading('Статистика') + `<div class="wp-period" role="group" aria-label="Период статистики"><button type="button" data-period="week" aria-pressed="${!month}">Неделя</button><button type="button" data-period="month" aria-pressed="${month}">Месяц</button></div>
      <div class="wp-surface"><div class="wp-eyebrow">${month ? 'Сентябрь' : '7–13 сентября'}</div><div class="wp-result-hero"><div class="wp-number">${month ? '124' : '94'} <small>мин</small></div></div><p class="wp-muted wp-small">${month ? '4 тренировки' : '3 тренировки'}</p><div class="wp-chart" style="grid-template-columns:repeat(${days.length},1fr)" role="img" aria-label="Продолжительность тренировок: ${days.map((d,i)=>`${d} ${times[i]} минут`).join(', ')}">${days.map((d,i) => `<div class="wp-bar"><i style="--height:${times[i]/Math.max(...times)*85}%"></i><span>${d}</span></div>`).join('')}</div></div>
      <section class="wp-section"><h2>История тренировок</h2>${history.map(([date,time,hr]) => `<div class="wp-row"><div><strong>${date}</strong><small>HR-контроль · ${time}</small></div><div style="text-align:right"><strong>${hr} <span class="wp-small wp-muted">уд/мин</span></strong><small>Средний пульс</small></div></div>`).join('')}<details><summary>Данные и качество измерений</summary><p>Средние показатели основаны на доступных измерениях. Если данных не хватает, показатель остаётся недоступным.</p></details></section>`;
  }
  function plank() {
    return heading('Планка') + `<div class="wp-eyebrow">${state.plankRunning ? 'Подход идёт' : 'Следующий подход'}</div><button type="button" class="wp-timer" data-plank aria-label="${state.plankRunning ? 'Сбросить подход' : 'Начать подход на 60 секунд'}"><span class="wp-number">${state.plankRunning ? '0:59' : '1:00'}</span><span class="wp-timer-label">${state.plankRunning ? 'Сбросить' : 'Начать подход'}</span></button><p class="wp-small wp-muted" style="text-align:center">Удерживайте круг, чтобы ${state.plankRunning ? 'отменить подход' : 'замерить свою планку'}</p>
      <section class="wp-section wp-surface"><div class="wp-section-title"><h2>Ваш ритм</h2>${icon('trending-up')}</div><div class="wp-row"><div><strong>После 3 подходов</strong><small>Прибавить 5 секунд</small></div><strong>2 / 3</strong></div><div class="wp-row"><span class="wp-small wp-muted">Следующая длительность</span><strong>1:05</strong></div></section>`;
  }
  function settings() {
    return heading('Параметры','ready','arrow-left') + `<div class="wp-surface"><div class="wp-row"><div><strong>Профиль</strong><small>Пользователь 1</small></div>${icon('user-round')}</div><div class="wp-row"><div><strong>Источник пульса</strong><small>HealthKit на iPhone</small></div>${icon('heart')}</div></div>
      <section class="wp-section wp-surface"><h2>Тренировка</h2><div class="wp-row"><strong>Целевая зона</strong><span>Зона ${state.zone}</span></div><div class="wp-row"><strong>Длительность</strong><span>${state.minutes} мин</span></div><div class="wp-row"><strong>Заминка</strong><span>115 уд/мин</span></div><details><summary>Настройка алгоритма</summary><p>Шаг скорости, пороги адаптивного шага и ограничения остаются в существующей форме параметров.</p></details></section>`;
  }
  function devices() {
    return heading('Дорожки','ready','arrow-left') + `<section class="wp-surface"><div class="wp-eyebrow">Подключена</div><div class="wp-row"><div><strong>WalkingPad</strong><small>Готова к тренировке</small></div><span style="color:var(--wp-green)">${icon('check-circle-2')}</span></div></section><section class="wp-section"><h2>Другие устройства</h2><p class="wp-note">Рядом пока нет других дорожек</p></section>`;
  }
  function ending() {
    return heading('Тренировка','ready','x') + `<section class="wp-empty">${icon('circle-ellipsis')}<h2>Завершаем тренировку…</h2><p class="wp-note">Проверяем остановку дорожки</p></section>`;
  }
  function debug() {
    return heading('Отладка','ready','arrow-left') + `<section class="wp-surface"><h2>Диагностика</h2><div class="wp-row"><strong>Журналы тренировок</strong>${icon('file-text')}</div><div class="wp-row"><strong>Ошибки пульса</strong>${icon('heart-pulse')}</div><div class="wp-row"><strong>Состояние подключения</strong>${icon('radio')}</div></section><p class="wp-note">Пустое состояние демонстрационной сессии</p>`;
  }
  function render() {
    phone.dataset.concept = state.concept;
    phone.dataset.large = String(state.largeText);
    const [phoneWidth,phoneHeight] = state.phoneSize.split('x').map(Number);
    phone.style.width = `min(100%,${phoneWidth}px)`;
    phone.style.setProperty('--wp-phone-height',`${phoneHeight}px`);
    phone.dataset.compact = String(phoneHeight < 700);
    phone.dataset.workout = String(['active','cooldown','no-hr','disconnected'].includes(state.screen));
    phone.style.setProperty('--wp-scale', state.largeText ? '1.3' : '1');
    root.style.colorScheme = state.appearance === 'system' ? 'light dark' : state.appearance;
    root.querySelectorAll('[data-concept]').forEach(button => { if (button.tagName === 'BUTTON') button.setAttribute('aria-pressed',String(button.dataset.concept === state.concept)); });
    const screen = state.screen;
    if ([...scenario.options].some(o => o.value === screen)) scenario.value = screen;
    const renderers = { ready, active, cooldown: active, 'no-hr': active, disconnected: active, result, partial: result, stats, plank, settings, devices, ending, debug };
    content.innerHTML = (renderers[screen] || ready)();
    const tab = ['stats','plank','debug'].includes(screen) ? screen : 'ready';
    root.querySelectorAll('.wp-tabbar button').forEach(button => button.setAttribute('aria-current',button.dataset.screen === tab ? 'page' : 'false'));
    if (globalThis.lucide) lucide.createIcons({ attrs: { width: 18, height: 18 } });
  }
  let dialogTrigger = null;
  function showExtendDialog(trigger) {
    dialogTrigger = trigger;
    overlay.hidden = false;
    overlay.innerHTML = `<div class="wp-dialog" role="dialog" aria-modal="true" aria-labelledby="wp-dialog-title"><h2 id="wp-dialog-title">Добавить 5 минут?</h2><p>Тренировка продлится ещё 5 минут перед заминкой.</p>${action('Добавить 5 минут','data-confirm-extend')}${action('Отмена','data-close-dialog','secondary')}</div>`;
    content.inert = true;
    root.querySelector('.wp-tabbar').inert = true;
    overlay.querySelector('button').focus();
  }
  function closeDialog() {
    overlay.hidden = true;
    overlay.innerHTML = '';
    content.inert = false;
    root.querySelector('.wp-tabbar').inert = false;
    if (dialogTrigger?.isConnected) dialogTrigger.focus();
  }
  root.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.concept) { state.concept = button.dataset.concept; render(); }
    else if (button.dataset.screen) { closeDialog(); state.screen = button.dataset.screen; render(); }
    else if (button.dataset.zone) { state.zone = Number(button.dataset.zone); render(); }
    else if (button.dataset.minutes) { state.minutes = Number(button.dataset.minutes); render(); }
    else if (button.dataset.period) { state.period = button.dataset.period; render(); }
    else if (button.hasAttribute('data-stop')) { state.screen = 'ending'; render(); }
    else if (button.hasAttribute('data-extend')) showExtendDialog(button);
    else if (button.hasAttribute('data-close-dialog')) closeDialog();
    else if (button.hasAttribute('data-confirm-extend')) { state.minutes += 5; closeDialog(); }
    else if (button.hasAttribute('data-plank')) { state.plankRunning = !state.plankRunning; render(); }
  });
  overlay.addEventListener('keydown', event => {
    if (event.key === 'Escape') { event.preventDefault(); closeDialog(); }
    if (event.key === 'Tab') {
      const buttons = [...overlay.querySelectorAll('button')];
      if (event.shiftKey && document.activeElement === buttons[0]) { event.preventDefault(); buttons.at(-1).focus(); }
      else if (!event.shiftKey && document.activeElement === buttons.at(-1)) { event.preventDefault(); buttons[0].focus(); }
    }
  });
  scenario.addEventListener('change', () => { closeDialog(); state.screen = scenario.value; render(); });
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: phone, onChange: render });
    tweak.addSelect(state,'appearance',{label:'Оформление',options:[{label:'Как в системе',value:'system'},{label:'Светлое',value:'light'},{label:'Тёмное',value:'dark'}]});
    tweak.addToggle(state,'largeText',{label:'Крупный текст'});
    tweak.addToggle(state,'showPiP',{label:'Пример окна PiP'});
    tweak.addSelect(state,'phoneSize',{label:'Размер iPhone',options:[{label:'393 × 852',value:'393x852'},{label:'375 × 667',value:'375x667'},{label:'430 × 932',value:'430x932'}]});
  }
})();
</script>
