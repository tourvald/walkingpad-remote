Verify only the assigned version-sensitive behavior against primary official documentation.
Return the narrow finding that affects the task, direct references, and bounded uncertainty.
Do not edit files, mutate Git/GitHub, use authenticated mutation APIs, access production/SSH,
change configuration/packages, perform BLE/controller/device work, or spawn agents.
